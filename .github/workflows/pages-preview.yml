name: JARVIS 2 manual test preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jarvis-2-pages-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'foundation/architecture'
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Prepare static PWA preview
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -R src _site/src
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload PWA preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref_name == 'foundation/architecture'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish test preview
        id: deployment
        uses: actions/deploy-pages@v4
